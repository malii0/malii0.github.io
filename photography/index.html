<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography - Muhammed Ali Onurlucan</title>
    <meta name="description" content="Personal photography archive by Muhammed Ali Onurlucan.">

    <link rel="canonical" href="https://malionurlucan.me/photography/">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- FOUC Önleyici -->
    <script>
        const storedTheme = localStorage.getItem("theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        if (storedTheme === "light" || (!storedTheme && prefersLight)) {
            document.documentElement.classList.add("light-mode");
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div class="container container-single">
        
        <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        
        <h1>Photography</h1>

        <!-- YALNIZCA GÖRSELLERDEN OLUŞAN OTOMATİK GRİD -->
        <div class="photo-grid" id="photo-gallery">
            <!-- Görseller JavaScript tarafındanOtomatik Yüklenecek -->
        </div>

    </div>

    <!-- Otomatik Fotoğraf Yükleyici Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const gallery = document.getElementById("photo-gallery");
            
            // img/photos/ altındaki 1.jpg'den başlayarak resimleri otomatik dener
            // Maksimum denenecek fotoğraf sayısı limitini yüksek tutabilirsin
            const maxPhotosToScan = 50; 

            for (let i = 1; i <= maxPhotosToScan; i++) {
                const imgPath = `/img/photos/${i}.jpg`;
                const img = new Image();
                
                img.src = imgPath;
                img.onload = function() {
                    const card = document.createElement("div");
                    card.className = "photo-card";
                    
                    const link = document.createElement("a");
                    link.href = imgPath;
                    link.target = "_blank";
                    link.rel = "noopener";
                    
                    const imageElement = document.createElement("img");
                    imageElement.src = imgPath;
                    imageElement.alt = `Photo ${i}`;
                    imageElement.loading = "lazy";
                    
                    link.appendChild(imageElement);
                    card.appendChild(link);
                    gallery.appendChild(card);
                };
                // Resim bulunamazsa (dosya yoksa) hatayı yutar, ekrana basmaz
                img.onerror = function() {}; 
            }
        });
    </script>

    <script src="/main.js"></script>
    <script data-goatcounter="https://malionurlucan.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
