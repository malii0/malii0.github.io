<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography - Muhammed Ali Onurlucan</title>
    <meta name="description" content="Personal photo gallery by Muhammed Ali Onurlucan.">

    <link rel="canonical" href="https://malionurlucan.me/photography/">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <script>
        const storedTheme = localStorage.getItem("theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        if (storedTheme === "light" || (!storedTheme && prefersLight)) {
            document.documentElement.classList.add("light-mode");
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">

    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>

    <link rel="stylesheet" href="/style.css" fetchpriority="high">
</head>
<body>

    <nav class="site-nav">
        <a href="/" class="brand">m.a.o</a>
        <div class="nav-items">
            <a href="/">home</a>
            <a href="/projects/">projects</a>
            <a href="/notes/">notes</a>
            <a href="/reading/">read / watch</a>
            <a href="/photography/" class="active">photography</a>
        </div>
    </nav>

    <main class="container container-single">

        <div class="page-label">photography</div>
        <p class="page-intro">Some photos I've taken, nothing more.</p>

        <!-- Dynamic Photo Grid Container -->
        <div id="photo-gallery" class="photo-grid"></div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const gallery = document.getElementById("photo-gallery");
            const apiUrl = "https://api.github.com/repos/malii0/malii0.github.io/contents/img/photos";

            try {
                let files = [];
                const cachedData = sessionStorage.getItem("gallery_photos");

                if (cachedData) {
                    files = JSON.parse(cachedData);
                } else {
                    const res = await fetch(apiUrl);
                    if (!res.ok) throw new Error("GitHub API fetch failed");
                    files = await res.json();
                    sessionStorage.setItem("gallery_photos", JSON.stringify(files));
                }

                const photos = files
                    .filter(f => /\.(jpe?g|png|webp)$/i.test(f.name))
                    .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

                if (photos.length === 0) {
                    gallery.innerHTML = '<p class="empty-note">No photos published yet, check back soon.</p>';
                    return;
                }

                photos.forEach((file, index) => {
                    const card = document.createElement("div");
                    card.className = "photo-card";

                    const link = document.createElement("a");
                    link.href = `/img/photos/${file.name}`;
                    link.target = "_blank";
                    link.rel = "noopener";

                    const imageElement = document.createElement("img");
                    imageElement.src = `/img/photos/${file.name}`;
                    imageElement.alt = `Photo ${index + 1}`;
                    imageElement.loading = "lazy";
                    imageElement.decoding = "async";

                    link.appendChild(imageElement);
                    card.appendChild(link);
                    gallery.appendChild(card);
                });
            } catch (err) {
                console.error("Gallery failed to load:", err);
                gallery.innerHTML = '<p class="empty-note">Unable to load gallery at the moment.</p>';
            }
        });
    </script>

    <script src="/main.js"></script>
    <script data-goatcounter="https://malionurlucan.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
