    <!-- FOUC Önleyici -->
    <script>
        const storedTheme = localStorage.getItem("theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        if (storedTheme === "light" || (!storedTheme && prefersLight)) {
            document.documentElement.classList.add("light-mode");
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="/style.css">
</head>

    <div class="container container-single">
        
        <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>

        <p class="about-text notes-intro">
            A minimal visual archive of places, observations, and moments captured along the way.
        </p>

                    <div class="photo-caption">METU Campus, Ankara</div>
                </a>
            </div>

        </div>

    </div>
